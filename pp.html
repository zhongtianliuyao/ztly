* {

html, body {
    margin: 0;
    padding: 0;

    background: #fff;
    color: #333;

}

.app {
    max-width: 760px;

    min-height: 100vh;
    padding: 16px;
}

.header {
    text-align: center;
    padding: 12px 0 18px;
}

.header h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 900;
}

.header p {
    margin: 8px 0 0;
    color: #777;
    font-size: 14px;
}

.card {
    background: #f8f8f8;
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 14px;
    border: 1px solid #eee;
}

label {
    display: block;
    font-weight: 800;
    margin-bottom: 6px;
}

input, textarea, select {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 11px;
    font-size: 16px;
    background: #fff;
    outline: none;
}

textarea {
    min-height: 70px;
    resize: vertical;
}

button {
    width: 100%;
    border: none;
    border-radius: 13px;
    padding: 13px;
    font-size: 16px;
    font-weight: 900;
    color: #fff;
    background: #333;
    cursor: pointer;
}

button.secondary {
    background: #777;
}

.btn-row {
    display: flex;
    gap: 10px;
    margin-top: 10px;
}

.hidden {
    display: none;
}

.back-btn {
    display: inline-block;
    width: auto;
    min-width: 0;
    margin: 0 0 10px 0;
    padding: 5px 10px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 800;
    line-height: 1.2;
    background: #333;
    color: #fff;
}

.manual-wrap {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

/*
    输入区视觉顺序：
    上爻、五爻、四爻、三爻、二爻、初爻。
    所以初爻在最底部。
*/
.manual-grid {
    display: grid;
    grid-template-columns: 64px 1fr;
    gap: 8px;
    align-items: center;
}

.manual-grid div {
    font-weight: 900;
    text-align: center;
}

/* 排盘样式 */
.apk-page {
    background: #fff;
    padding: 12px 0 36px;
    text-align: left;
}

/* 允许长按拖动复制 */
.apk-page,
.apk-page * {
    -webkit-user-select: text;
    user-select: text;
}

.apk-question {
    font-size: 22px;
    font-weight: 900;
    line-height: 1.45;
    color: #444;
}

.apk-time {
    font-size: 24px;
    font-weight: 900;
    line-height: 1.45;
    color: #444;
}

.apk-ganzhi {
    font-size: 24px;
    font-weight: 900;
    line-height: 1.45;
    color: #444;
    margin-bottom: 28px;
}

.apk-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

.apk-table th {
    font-size: 23px;
    font-weight: 900;
    color: #444;
    padding-bottom: 10px;
    white-space: nowrap;
    text-align: left;
}

.apk-table td {
    font-size: 22px;
    font-weight: 900;
    color: #444;
    line-height: 1.55;
    white-space: nowrap;
    vertical-align: top;
}

.col-god {
    width: 13%;
    text-align: left;
}

.col-fu {
    width: 22%;
    text-align: left;
}

.col-main {
    width: 36%;
    text-align: left;
}

.col-change {
    width: 29%;
    text-align: left;
}

.small-tip {
    font-size: 13px;
    color: #777;
    line-height: 1.8;
}

.warn {
    color: #b00000;
    font-weight: 900;
}

.debug {
    display: none;
    margin-top: 12px;
    padding: 10px;
    border-radius: 10px;
    background: #f2f2f2;
    color: #666;
    font-size: 13px;
    line-height: 1.7;
    word-break: break-all;

@media (max-width: 520px) {
    .app {

    }

    .apk-question,
    .apk-time,

@media (max-width: 430px) {

    .apk-time,

    }

    }

    .apk-table td {

    }

/*
 * 子初换日：23:00起使用次日日柱。
 * 只调整日柱取值，不把实际公历时间整体改成第二天。
 */
function getPanDayInfo(date) {
    const dayDate = new Date(date.getTime());

    if (date.getHours() === 23) {
        dayDate.setHours(0, 0, 0, 0);
        dayDate.setDate(dayDate.getDate() + 1);
    }

    const dayLunar = Lunar.fromDate(dayDate);
    const day = dayLunar.getDayInGanZhi();
    const dayGan = day.charAt(0);

    return {
        day,
        dayGan,
        kong: dayLunar.getDayXunKong(),
        // 使用换日后的日干，配实际时辰。
        hour: getHourGZ(dayGan, date.getHours())
    };
}

    const monthGZ = lunar.getMonthInGanZhi();

        !hasMoving
    );

    document.getElementById("debugBox").innerHTML =
        "本卦编码：" + mainCode + " = " + mainName + "<br>" +
        "变卦编码：" + changeCode + " = " + changeName;

    // 起完卦后，隐藏首页
    document.getElementById("headerCard").classList.add("hidden");
    document.getElementById("inputCard").classList.add("hidden");
    document.getElementById("manualCard").classList.add("hidden");

    // 显示排盘结果
    document.getElementById("resultCard").classList.remove("hidden");
    document.getElementById("resultCard").scrollIntoView({ behavior: "smooth" });
}

/*
 * 八宫游魂、归魂卦。
 * 主卦和变卦分别按各自卦名判断。
 */
const youHunNames = new Set([
    "火地晋",
    "地火明夷",
    "风泽中孚",
    "泽风大过",
    "山雷颐",
    "天水讼",
    "水天需",
    "雷山小过"
]);

const guiHunNames = new Set([
    "火天大有",
    "地水师",
    "风山渐",
    "泽雷随",
    "山风蛊",
    "天火同人",
    "水地比",
    "雷泽归妹"
]);

/*
 * 爻位从下往上：1初爻，6上爻。
 * 游魂、归魂只替换世爻标记，应爻仍显示“应”。
 */
function getShiYingMark(guaName, position) {
    const pair = shiYingMap[guaName];

    if (!pair) return "";

    if (position === pair[0]) {
        if (youHunNames.has(guaName)) return "游";
        if (guiHunNames.has(guaName)) return "归";
        return "世";
    }

    if (position === pair[1]) {
        return "应";
    }

    return "";
}

function makeApkRows(ctx) {
    const {
        arr,
        mainCode,
        changeCode,
        mainName,
        changeName,
        dayGan
    } = ctx;

    const hasMoving = arr.some(value => value === 6 || value === 9);

    const sixGods = getSixGods(dayGan);
    const mainPan = makeMainPan(mainCode, mainName, dayGan, arr);
    const fuPan = makeFuPan(mainCode, mainName, dayGan);

    // 变卦六亲仍按主卦宫五行计算，保留原规则。
    const changePan = hasMoving
        ? makeChangePan(changeCode, mainName, dayGan)
        : [];

    let html = "";

    // 显示顺序：上爻到初爻。
    for (let i = 5; i >= 0; i--) {
        const position = i + 1;

        let mainText = mainPan[i] || "";
        const mainMark = getShiYingMark(mainName, position);

        if (mainMark) {
            mainText += " " + mainMark;
        }

        let changeCell = "";

        if (hasMoving) {
            let changeText = changePan[i] || "";

            // 变卦世应按变卦本身确定，不沿用主卦世应。
            const changeMark = getShiYingMark(changeName, position);

            if (changeMark) {
                changeText += " " + changeMark;
            }

            changeCell = `
                <td class="col-change">${changeText}</td>
            `;
        }

        html += `
            <tr>
                <td class="col-god">${sixGods[i] || ""}</td>
                <td class="col-fu">${fuPan[i] || ""}</td>
                <td class="col-main">${mainText}</td>
                ${changeCell}
            </tr>
        `;
    }

    return html;
}

/* =========================
   装卦
========================= */

function makeMainPan(code, guaName, dayGan, arr) {
    const palace = palaceMap[guaName] || "";
    const palaceWu = palaceWuxing[palace] || "";

    const na = getNaArrayByCode(code, dayGan);
    const lines = [];

    for (let i = 0; i < 6; i++) {
        const rel = getLiuQin(palaceWu, na[i]);
        const mark = yaoSymbol(arr[i]);

        /*
            7 少阳：、
            8 少阴：、、
            9 老阳：O
            6 老阴：X
        */
        lines.push(rel + na[i].slice(0, 2) + mark);
    }

    return lines;
}

function makeChangePan(code, mainName, dayGan) {
    /*
        变卦：
        地支按变卦重新装。
        天干按日干五鼠遁。
        六亲按主卦宫五行定。
    */
    const mainPalace = palaceMap[mainName] || "";
    const palaceWu = palaceWuxing[mainPalace] || "";

    const na = getNaArrayByCode(code, dayGan);
    const lines = [];

    for (let i = 0; i < 6; i++) {
        const rel = getLiuQin(palaceWu, na[i]);
        const mark = normalYaoSymbolByBit(code[i]);

        lines.push(rel + na[i].slice(0, 2) + mark);
    }

    return lines;
}

function getNaArrayByCode(code, dayGan) {
    const lowerCode = code.slice(0, 3);
    const upperCode = code.slice(3, 6);

    const lowerGua = trigramName[lowerCode] || "";
    const upperGua = trigramName[upperCode] || "";

    const lowerZhi = naZhiBase[lowerGua] || ["","","","","",""];
    const upperZhi = naZhiBase[upperGua] || ["","","","","",""];

    /*
        下卦取下卦的初、二、三爻。
        上卦取上卦的四、五、上爻。
    */
    return [
        attachFiveRatGan(dayGan, lowerZhi[0]),
        attachFiveRatGan(dayGan, lowerZhi[1]),
        attachFiveRatGan(dayGan, lowerZhi[2]),
        attachFiveRatGan(dayGan, upperZhi[3]),
        attachFiveRatGan(dayGan, upperZhi[4]),
        attachFiveRatGan(dayGan, upperZhi[5])
    ];
}

/* =========================
   伏神：按相害地支
========================= */

const harmMap = {
    "子": "未",
    "未": "子",
    "丑": "午",
    "午": "丑",
    "寅": "巳",
    "巳": "寅",
    "卯": "辰",
    "辰": "卯",
    "申": "亥",
    "亥": "申",
    "酉": "戌",
    "戌": "酉"
};

function makeFuPan(mainCode, mainName, dayGan) {
    const palace = palaceMap[mainName] || "";
    const palaceWu = palaceWuxing[palace] || "";

    const mainNa = getNaArrayByCode(mainCode, dayGan);
    const fu = [];

    for (let i = 0; i < 6; i++) {
        const current = mainNa[i];

        if (!current) {
            fu.push("");
            continue;
        }

        const currentZhi = current.charAt(1);
        const harmZhi = harmMap[currentZhi];

        if (!harmZhi) {
            fu.push("");
            continue;
        }

        const harmWx = zhiWuxing[harmZhi];
        const harmGan = getGanByFiveRat(dayGan, harmZhi);
        const harmGanZhiWu = harmGan + harmZhi + harmWx;
        const rel = getLiuQin(palaceWu, harmGanZhiWu);

        /*
            伏神格式：六亲 + 天干 + 地支
            例如：官鬼甲辰
        */
        fu.push(rel + harmGan + harmZhi);
    }

    return fu;
}

/* =========================
   六亲、五鼠遁、六神
========================= */

function getLiuQin(palaceWu, ganZhiWu) {
    /*
        ganZhiWu 格式：甲辰土
        第三个字为五行。
    */
    if (!palaceWu || !ganZhiWu) return "";

    const wx = ganZhiWu.charAt(2);

    if (palaceWu === wx) return "兄弟";

    const self = wuxingCycle.indexOf(palaceWu);
    const other = wuxingCycle.indexOf(wx);

    if (self < 0 || other < 0) return "";

    /*
        我生者子孙
        生我者父母
        我克者妻财
        克我者官鬼
    */
    if ((self + 1) % 5 === other) return "子孙";
    if ((other + 1) % 5 === self) return "父母";
    if ((self + 2) % 5 === other) return "妻财";
    if ((other + 2) % 5 === self) return "官鬼";

    return "";
}

function getGanByFiveRat(dayGan, branch) {
    /*
        五鼠遁：
        甲己还加甲
        乙庚丙作初
        丙辛从戊起
        丁壬庚子居
        戊癸壬子起
    */
    const startMap = {
        "甲": "甲",
        "己": "甲",
        "乙": "丙",
        "庚": "丙",
        "丙": "戊",
        "辛": "戊",
        "丁": "庚",
        "壬": "庚",
        "戊": "壬",
        "癸": "壬"
    };

    const startGan = startMap[dayGan] || "甲";
    const startGanIndex = gan.indexOf(startGan);
    const branchIndex = zhi.indexOf(branch);

    return gan[mod(startGanIndex + branchIndex, 10)];
}

function attachFiveRatGan(dayGan, branchWu) {
    /*
        输入：辰土
        输出：甲辰土、庚辰土等
    */
    if (!branchWu) return "";

    const branch = branchWu.charAt(0);
    const wx = branchWu.charAt(1);
    const tg = getGanByFiveRat(dayGan, branch);

    return tg + branch + wx;
}

function getSixGods(dayGan) {
    /*
        数组顺序：初爻 -> 上爻。
        显示时倒序。
    */
    const map = {
        "甲": ["青龙","朱雀","勾陈","螣蛇","白虎","玄武"],
        "乙": ["青龙","朱雀","勾陈","螣蛇","白虎","玄武"],
        "丙": ["朱雀","勾陈","螣蛇","白虎","玄武","青龙"],
        "丁": ["朱雀","勾陈","螣蛇","白虎","玄武","青龙"],
        "戊": ["勾陈","螣蛇","白虎","玄武","青龙","朱雀"],
        "己": ["螣蛇","白虎","玄武","青龙","朱雀","勾陈"],
        "庚": ["白虎","玄武","青龙","朱雀","勾陈","螣蛇"],
        "辛": ["白虎","玄武","青龙","朱雀","勾陈","螣蛇"],
        "壬": ["玄武","青龙","朱雀","勾陈","螣蛇","白虎"],
        "癸": ["玄武","青龙","朱雀","勾陈","螣蛇","白虎"]
    };

    return map[dayGan] || ["青龙","朱雀","勾陈","螣蛇","白虎","玄武"];
}

/* =========================
   爻值
========================= */

function yaoSymbol(n) {
    if (n === 7) return "、";
    if (n === 8) return "、、";
    if (n === 9) return "O";
    if (n === 6) return "X";
    return "";
}

function normalYaoSymbolByBit(bit) {
    return bit === "1" ? "、" : "、、";
}

function yaoToBit(n) {
    /*
        7 少阳，9 老阳：阳爻
        8 少阴，6 老阴：阴爻
    */
    return n === 7 || n === 9 ? "1" : "0";
}

function changedBit(n) {
    /*
        6 老阴变阳
        9 老阳变阴
        7 少阳不变
        8 少阴不变
    */
    if (n === 6) return "1";
    if (n === 9) return "0";
    if (n === 7) return "1";
    return "0";
}

/* =========================
   干支万年历
========================= */

function getGanzhi(date) {
    const yearGZ = getYearGZ(date);
    const monthGZ = getMonthGZ(date, yearGZ);
    const dayInfo = getDayGZ(date);
    const hourGZ = getHourGZ(dayInfo.gan, date.getHours());

    return {
        year: yearGZ,
        month: monthGZ,
        day: dayInfo.gz,
        hour: hourGZ,
        dayGan: dayInfo.gan,
        dayZhi: dayInfo.zhi
    };
}

function getYearGZ(date) {
    /*
        年柱以立春为界。
    */
    let y = date.getFullYear();
    const lichun = getSolarTermDate(y, 2);

    if (date < lichun) {
        y -= 1;
    }

    /*
        1984 为甲子年。
    */
    const index = mod(y - 1984, 60);
    return gan[index % 10] + zhi[index % 12];
}

function getMonthGZ(date, yearGZ) {
    /*
        月柱以节为界。
        寅月从立春起。
    */
    const monthZhi = getMonthZhiByJie(date);
    const yearGan = yearGZ.charAt(0);

    /*
        五虎遁月：
        甲己年丙寅
        乙庚年戊寅
        丙辛年庚寅
        丁壬年壬寅
        戊癸年甲寅
    */
    const startGanMap = {
        "甲": "丙",
        "己": "丙",
        "乙": "戊",
        "庚": "戊",
        "丙": "庚",
        "辛": "庚",
        "丁": "壬",
        "壬": "壬",
        "戊": "甲",
        "癸": "甲"
    };

    const startGanIndex = gan.indexOf(startGanMap[yearGan]);
    const monthZhiIndex = zhi.indexOf(monthZhi);

    /*
        寅月地支索引为 2。
    */
    const offset = mod(monthZhiIndex - 2, 12);
    const monthGan = gan[mod(startGanIndex + offset, 10)];

    return monthGan + monthZhi;
}

function getMonthZhiByJie(date) {
    const y = date.getFullYear();

    /*
        十二节：
        小寒丑、立春寅、惊蛰卯、清明辰、立夏巳、芒种午、
        小暑未、立秋申、白露酉、寒露戌、立冬亥、大雪子。
    */
    const jieList = [
        { index: 0, zhi: "丑" },
        { index: 2, zhi: "寅" },
        { index: 4, zhi: "卯" },
        { index: 6, zhi: "辰" },
        { index: 8, zhi: "巳" },
        { index: 10, zhi: "午" },
        { index: 12, zhi: "未" },
        { index: 14, zhi: "申" },
        { index: 16, zhi: "酉" },
        { index: 18, zhi: "戌" },
        { index: 20, zhi: "亥" },
        { index: 22, zhi: "子" }
    ];

    let all = [];

    for (let yy = y - 1; yy <= y + 1; yy++) {
        jieList.forEach(function(item) {
            all.push({
                date: getSolarTermDate(yy, item.index),
                zhi: item.zhi
            });
        });
    }

    all.sort(function(a, b) {
        return a.date - b.date;
    });

    let current = all[0];

    for (let i = 0; i < all.length; i++) {
        if (all[i].date <= date) {
            current = all[i];
        } else {
            break;
        }
    }

    return current.zhi;
}

function getDayGZ(date) {
    /*
        日柱基准：
        1900-01-31 为甲辰日。
        甲辰在六十甲子序号中为 40。
    */
    const base = new Date(1900, 0, 31);
    const target = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    const offset = daysBetween(base, target);

    const index = mod(offset + 40, 60);
    const gz = gan[index % 10] + zhi[index % 12];

    return {
        gz,
        gan: gz.charAt(0),
        zhi: gz.charAt(1),
        index
    };
}

function getHourGZ(dayGan, hour) {
    /*
        时柱按五鼠遁。
    */
    const hourZhiIndex = getHourZhiIndex(hour);
    const dayGanIndex = gan.indexOf(dayGan);

    const startMap = {
        0: 0,
        5: 0,
        1: 2,
        6: 2,
        2: 4,
        7: 4,
        3: 6,
        8: 6,
        4: 8,
        9: 8
    };

    const hourGanIndex = mod(startMap[dayGanIndex] + hourZhiIndex, 10);

    return gan[hourGanIndex] + zhi[hourZhiIndex];
}

function getHourZhiIndex(h) {
    if (h === 23 || h === 0) return 0;
    if (h >= 1 && h < 3) return 1;
    if (h >= 3 && h < 5) return 2;
    if (h >= 5 && h < 7) return 3;
    if (h >= 7 && h < 9) return 4;
    if (h >= 9 && h < 11) return 5;
    if (h >= 11 && h < 13) return 6;
    if (h >= 13 && h < 15) return 7;
    if (h >= 15 && h < 17) return 8;
    if (h >= 17 && h < 19) return 9;
    if (h >= 19 && h < 21) return 10;
    return 11;
}

function getXunKong(dayGan, dayZhi) {
    const ganIndex = gan.indexOf(dayGan);
    const zhiIndex = zhi.indexOf(dayZhi);

    /*
        旬首地支 = 当前地支索引 - 当前天干索引
    */
    const xunStartZhiIndex = mod(zhiIndex - ganIndex, 12);

    const empty1 = zhi[mod(xunStartZhiIndex + 10, 12)];
    const empty2 = zhi[mod(xunStartZhiIndex + 11, 12)];

    return empty1 + empty2;
}

/* =========================
   工具
========================= */

function makeGuaNameByCode(code) {
    const lower = trigramName[code.slice(0, 3)] || "";
    const upper = trigramName[code.slice(3, 6)] || "";

    if (!lower || !upper) return "未知卦";

    const upperImg = trigramImage[upper];
    const lowerImg = trigramImage[lower];

    if (upper === lower) {
        return upper + "为" + upperImg;
    }

    return upperImg + lowerImg;
}

function formatDateTime(d) {
    const pad = n => String(n).padStart(2, "0");

    return d.getFullYear() + "年" +
        pad(d.getMonth() + 1) + "月" +
        pad(d.getDate()) + "日 " +
        pad(d.getHours()) + ":" +
        pad(d.getMinutes());
}

function daysBetween(date1, date2) {
    const one = Date.UTC(date1.getFullYear(), date1.getMonth(), date1.getDate());
    const two = Date.UTC(date2.getFullYear(), date2.getMonth(), date2.getDate());

    return Math.floor((two - one) / 86400000);
}

function mod(n, m) {
    return ((n % m) + m) % m;
}

<script>
(function () {

    const $ = id => document.getElementById(id);

    const modeNames = {
        manual: "自选排盘",
        number: "数字起卦",
        year: "年命卦",
        life: "终身卦",
        time: "时间起卦"
    };

    /*
     * 先天卦数。
     * 编码从初爻往上排列，下卦编码在前。
     */
    const numberToCode = {
        1: "111", // 乾
        2: "110", // 兑
        3: "101", // 离
        4: "100", // 震
        5: "011", // 巽
        6: "010", // 坎
        7: "001", // 艮
        8: "000"  // 坤
    };

    const numberToName = {
        1: "乾", 2: "兑", 3: "离", 4: "震",
        5: "巽", 6: "坎", 7: "艮", 8: "坤"
    };

    let activeMode = "";
    let currentNote = "";
    let busy = false;

    const originalRenderResult = window.renderResult;

    /* =========================
       创建菜单和设置卡片
    ========================= */

    const menu = document.createElement("section");
    menu.id = "modeMenu";
    menu.className = "card";

    menu.innerHTML = `
        <h2 class="mode-menu-title">选择起卦方式</h2>
        <div class="mode-menu-grid">
            ${[
                ["manual", "自选", "排盘"],
                ["number", "数字", "起卦"],
                ["year", "年命", "卦"],
                ["life", "终身", "卦"],
                ["time", "时间", "起卦"]
            ].map(item => `
                <button type="button"
                        class="mode-menu-btn"
                        data-mode="${item[0]}"
                        aria-controls="modeSettings"
                        aria-expanded="false">
                    <span>${item[1]}<br>${item[2]}</span>
                </button>
            `).join("")}
        </div>
    `;

    $("headerCard").insertAdjacentElement("afterend", menu);

    const settings = document.createElement("section");
    settings.id = "modeSettings";
    settings.className = "card hidden";
    settings.setAttribute("aria-labelledby", "modeSettingsTitle");

    settings.innerHTML = `
        <div class="mode-settings-head">
            <h2 id="modeSettingsTitle">排盘设置</h2>
        </div>
    `;

    menu.insertAdjacentElement("afterend", settings);

    const inputCard = $("inputCard");
    const manualCard = $("manualCard");

    const oldButtonRow = inputCard.querySelector(".btn-row");
    if (oldButtonRow) oldButtonRow.remove();

    settings.appendChild(inputCard);
    settings.appendChild(manualCard);

    /*
     * 起卦时间字段仍使用原来的 datetime。
     * 终身卦单独输入出生时间，计算时临时传给原排盘函数。
     */
    const dateField = $("datetime").parentElement;

    const nowButton = document.createElement("button");
    nowButton.type = "button";
    nowButton.className = "mode-now-btn";
    nowButton.textContent = "使用当前时间";
    nowButton.addEventListener("click", function () {
        setDateTimeInput(new Date());
    });

    $("datetime").insertAdjacentElement("afterend", nowButton);

    function addPanel(id, html) {
        const panel = document.createElement("div");
        panel.id = id;
        panel.className = "mode-panel hidden";
        panel.innerHTML = html;
        settings.appendChild(panel);
        return panel;
    }

    const numberPanel = addPanel("modeNumberPanel", `
        <div class="mode-number-grid">
            <div>
                <label for="modeNumberUpper">上卦数</label>
                <input id="modeNumberUpper"
                       type="text"
                       inputmode="numeric"
                       maxlength="100"
                       placeholder="第一个数">
            </div>
            <div>
                <label for="modeNumberLower">下卦数</label>
                <input id="modeNumberLower"
                       type="text"
                       inputmode="numeric"
                       maxlength="100"
                       placeholder="第二个数">
            </div>
            <div>
                <label for="modeNumberMoving">动爻数</label>
                <input id="modeNumberMoving"
                       type="text"
                       inputmode="numeric"
                       maxlength="100"
                       placeholder="第三个数">
            </div>
        </div>

        <div class="mode-rule">
            第一个数除以8，余数定上卦，余0作2。<br>
            第二个数除以8，余数定下卦，余0作2。<br>
            第三个数除以6，余数定动爻，余0作2。<br>
            请输入非负整数。<br>
            先天卦数：乾1、兑2、离3、震4、巽5、坎6、艮7、坤8。
        </div>

        <button id="modeNumberSubmit" type="button">
            生成排盘
        </button>
    `);

    const yearPanel = addPanel("modeYearPanel", `
<div class="mode-field">
    <label for="modeYearBirth">出生年份</label>
    <input id="modeYearBirth"
           type="text"
           inputmode="numeric"
           maxlength="4"
           placeholder="例如：1990">

    <p class="small-tip">
        以立春为界：立春后出生填当年，立春前出生填前一年。
        仅输入年份，程序不会自动判断是否已过立春。
    </p>
</div>

        <div class="mode-rule">
            出生资料只用于确定年命干支，以立春交节时刻为界。<br><br>
            起卦总数＝起卦年干＋年支＋月支＋日支＋时支。<br>
            上卦＝起卦总数除以8，余0作2。<br>
            下卦＝起卦总数再加年命干、支序数，除以8，余0作2。<br>
            动爻＝起卦总数除以6，余0则无动爻。<br><br>
            天干：甲1至癸10；地支：子1至亥12。<br>
            使用上方“起卦时间”装盘。
        </div>

        <button id="modeYearSubmit" type="button">
            生成年命卦
        </button>
    `);

    const lifePanel = addPanel("modeLifePanel", `
        <div class="mode-field">
            <label for="modeLifeBirth">公历出生日期与时间</label>
            <input id="modeLifeBirth"
                   type="datetime-local"
                   step="60">
        </div>

        <div class="mode-rule">
            以下各项均取出生时间的干支序数：<br><br>
            基础数＝年干＋年支＋月支＋日支。<br>
            上卦＝基础数除以8，余0作2。<br>
            总数＝基础数＋时支。<br>
            下卦＝总数除以8，余0作2。<br>
            动爻＝总数除以6，余0则无动爻。<br><br>
            天干：甲1至癸10；地支：子1至亥12。<br>
            使用出生时间装盘。
        </div>

        <button id="modeLifeSubmit" type="button">
            生成终身卦
        </button>
    `);

    /*
     * 时间起卦保留上一版规则，不随数字起卦改动。
     */
    const timePanel = addPanel("modeTimePanel", `
        <div class="mode-rule">
            此项保留上一版的农历年月日时取数规则：<br>
            年数取农历年地支序数，子1至亥12。<br>
            月、日取农历月数和日数；闰月按同名月份取数。<br>
            时数取时辰地支序数，子1至亥12。<br><br>
            年数＋月数＋日数，除以8取上卦；<br>
            再加时数，除以8取下卦，除以6取动爻。<br>
            本项余0仍按：上下卦取8、动爻取6。<br><br>
            输入按设备本地时间解释，不作真太阳时修正。
        </div>

        <button id="modeTimeSubmit" type="button">
            生成排盘
        </button>
    `);

    const errorBox = document.createElement("div");
    errorBox.id = "modeError";
    errorBox.className = "mode-error hidden";
    errorBox.setAttribute("role", "alert");
    settings.appendChild(errorBox);

    const resultNote = document.createElement("div");
    resultNote.id = "modeResultNote";
    resultNote.className = "mode-result-note";
    $("apkQuestion").insertAdjacentElement("afterend", resultNote);

    const panels = {
        manual: manualCard,
        number: numberPanel,
        year: yearPanel,
        life: lifePanel,
        time: timePanel
    };

    /* =========================
       菜单交互
    ========================= */

    function clearError() {
        errorBox.textContent = "";
        errorBox.classList.add("hidden");
    }

    function showError(message) {
        errorBox.textContent = message;
        errorBox.classList.remove("hidden");
    }

    function closeSettings() {
        activeMode = "";
        settings.classList.add("hidden");
        clearError();

        menu.querySelectorAll("[data-mode]").forEach(button => {
            button.setAttribute("aria-expanded", "false");
        });
    }

function openMode(mode) {
        activeMode = mode;
        currentNote = "";
        clearError();

        activeMode = mode;
        currentNote = "";
        clearError();

        $("modeSettingsTitle").textContent =
            modeNames[mode] + "设置";

        settings.classList.remove("hidden");
        inputCard.classList.remove("hidden");

        /* 终身卦不显示容易混淆的另一个起卦时间 */
        dateField.classList.toggle("hidden", mode === "life");

        Object.entries(panels).forEach(([key, panel]) => {
            panel.classList.toggle("hidden", key !== mode);
        });

        menu.querySelectorAll("[data-mode]").forEach(button => {
            button.setAttribute(
                "aria-expanded",
                String(button.dataset.mode === mode)
            );
        });
    }

    menu.querySelectorAll("[data-mode]").forEach(button => {
        button.addEventListener("click", function () {
            openMode(button.dataset.mode);
        });
    });

    window.showManual = function () {
        openMode("manual");
    };

    /* =========================
       日期、历法及序数
    ========================= */

    function readDate(id, label) {
        const value = $(id).value;

        if (!value) {
            throw new Error("请填写" + label + "。");
        }

        const date = new Date(value);
        if (Number.isNaN(date.getTime())) {
            throw new Error(label + "无效，请重新选择。");
        }

        return date;
    }

    function getLunar(date) {
        if (typeof Lunar === "undefined" ||
            typeof Lunar.fromDate !== "function") {
            throw new Error(
                "未能加载 lunar.js，请确认文件与 HTML 在同一目录。"
            );
        }

        return Lunar.fromDate(date);
    }

    function serial(list, char, label) {
        const value = list.indexOf(char) + 1;

        if (value < 1) {
            throw new Error(label + "读取失败，请检查 lunar.js。");
        }

        return value;
    }

function getBirthYearInfo() {
    const text = $("modeYearBirth").value.trim();

    if (!/^[0-9]{1,4}$/.test(text)) {
        throw new Error("请输入出生年份，例如：1990。");
    }

    const year = Number(text);

    if (year < 1 || year > 9999) {
        throw new Error("出生年份范围为1至9999。");
    }

    /*
     * 1984年为甲子年。
     * 填写年份视为已经按立春归属调整的年份：
     * 立春前出生，由用户填写前一年。
     */
    const index = ((year - 1984) % 60 + 60) % 60;
    const ganIndex = index % 10;
    const zhiIndex = index % 12;

    return {
        year,
        gz: gan[ganIndex] + zhi[zhiIndex],
        gan: ganIndex + 1,
        zhi: zhiIndex + 1
    };
}

    function getPillars(date, exact) {
        const lunar = getLunar(date);

        if (exact &&
            (typeof lunar.getYearInGanZhiExact !== "function" ||
             typeof lunar.getMonthInGanZhiExact !== "function")) {
            throw new Error(
                "当前 lunar.js 不支持精确交节年、月柱，" +
                "请使用支持 getYearInGanZhiExact 和 " +
                "getMonthInGanZhiExact 的版本。"
            );
        }

        const year = exact
            ? lunar.getYearInGanZhiExact()
            : lunar.getYearInGanZhi();

        const month = exact
            ? lunar.getMonthInGanZhiExact()
            : lunar.getMonthInGanZhi();

        const dayInfo = getPanDayInfo(date);
        const day = dayInfo.day;
        const hour = dayInfo.hour;

        return {
            year,
            month,
            day,
            hour,
            kong: dayInfo.kong,
            yearGan: serial(gan, year.charAt(0), "年干"),
            yearZhi: serial(zhi, year.charAt(1), "年支"),
            monthZhi: serial(zhi, month.charAt(1), "月支"),
            dayZhi: serial(zhi, day.charAt(1), "日支"),
            hourZhi: serial(zhi, hour.charAt(1), "时支")
        };
    }

    /* 上下卦：除8，余0作2 */
    function guaRemainder(total) {
        return total % 8 || 2;
    }

    /*
     * moving 为0时不设动爻。
     * 阳静爻7，阴静爻8；阳动爻9，阴动爻6。
     */
    function makeYao(upper, lower, moving) {
        if (!numberToCode[upper] ||
            !numberToCode[lower] ||
            !Number.isInteger(moving) ||
            moving < 0 || moving > 6) {
            throw new Error("上下卦或动爻数据无效。");
        }

        const code = numberToCode[lower] + numberToCode[upper];

        return code.split("").map((bit, index) => {
            const isMoving = moving > 0 && index + 1 === moving;

            if (isMoving) return bit === "1" ? 9 : 6;
            return bit === "1" ? 7 : 8;
        });
    }

    function resultSummary(upper, lower, moving) {
        return (
            "上卦：" + numberToName[upper] + "（" + upper + "）" +
            "；下卦：" + numberToName[lower] + "（" + lower + "）\n" +
            (moving === 0
                ? "动爻：无，静卦"
                : "动爻：第" + moving + "爻（自下往上数）")
        );
    }

    function pillarSummary(p) {
        return (
            p.year + "年 " + p.month + "月 " +
            p.day + "日 " + p.hour + "时"
        );
    }

    function readInteger(id, label) {
        const text = $(id).value.trim();

        if (!/^[0-9]+$/.test(text) || text.length > 100) {
            throw new Error(label + "请输入不超过100位的非负整数。");
        }

        return text;
    }

    /* 逐位取余，避免大整数精度丢失 */
/*
     * 数字起卦取数：
     * 1～divisor 直接取数；
     * 其他非负整数逐位取余。
     * 余0作2仍由调用处处理。
     */
    function decimalRemainder(text, divisor) {
        const direct = Number(text);

        if (
            Number.isInteger(direct) &&
            direct >= 1 &&
            direct <= divisor
        ) {
            return direct;
        }

        // 大整数逐位取余，避免精度丢失。
        let remainder = 0;

        for (const char of text) {
            remainder = (remainder * 10 + Number(char)) % divisor;
        }

        return remainder;
    }

    /* =========================
       排盘衔接
    ========================= */

    function generate(arr, date, note, pillars) {
        if (!Array.isArray(arr) ||
            arr.length !== 6 ||
            !arr.every(value => [6, 7, 8, 9].includes(value))) {
            throw new Error("六爻数据无效。");
        }

        getLunar(date);

        const savedDatetime = $("datetime").value;

        try {
            /*
             * 原函数读取 datetime。
             * 终身卦临时切换到出生时间，完成后恢复。
             */
            setDateTimeInput(date);
            originalRenderResult(arr);

            if ($("resultCard").classList.contains("hidden")) {
                throw new Error("排盘未能生成，请检查输入。");
            }

            /*
             * 年命、终身的显示年/月柱与实际取数保持一致。
             * 原来的日干、六亲、六神、旬空计算不变。
             */
            if (pillars) {
                $("apkGanzhi").textContent =
                    pillarSummary(pillars) +
                    " （" + pillars.kong + "空）";
            }

            resultNote.textContent = String(note || "").split("\n")[0];

            menu.classList.add("hidden");
            settings.classList.add("hidden");

            $("headerCard").classList.add("hidden");

            window.scrollTo({ top: 0, behavior: "smooth" });
        } finally {
            $("datetime").value = savedDatetime;
        }
    }

    function run(task) {
        if (busy) return;

        busy = true;
        clearError();

        try {
            task();
        } catch (error) {
            showError(error.message || "排盘失败，请检查输入。");
        } finally {
            busy = false;
        }
    }

    /* 原手动输入仍通过 renderResult 调用 */
    window.renderResult = function (arr) {
        run(function () {
            const date = readDate("datetime", "起卦时间");
            generate(arr, date, "起卦方式：自选排盘", null);
        });
    };

    /* =========================
       数字起卦
    ========================= */

    $("modeNumberSubmit").addEventListener("click", function () {
        run(function () {
            const date = readDate("datetime", "起卦时间");

            const first = readInteger("modeNumberUpper", "上卦数");
            const second = readInteger("modeNumberLower", "下卦数");
            const third = readInteger("modeNumberMoving", "动爻数");

            const upper = decimalRemainder(first, 8) || 2;
            const lower = decimalRemainder(second, 8) || 2;
            const moving = decimalRemainder(third, 6);

            currentNote =
                "起卦方式：数字起卦\n" +
                "输入：" + first + "、" + second + "、" + third + "\n" +
                resultSummary(upper, lower, moving);

            generate(
                makeYao(upper, lower, moving),
                date,
                currentNote,
                null
            );
        });
    });

    /* =========================
       终身卦
    ========================= */

    $("modeLifeSubmit").addEventListener("click", function () {
        run(function () {
            const birth = readDate("modeLifeBirth", "公历出生日期与时间");
            const p = getPillars(birth, true);

            const base =
                p.yearGan +
                p.yearZhi +
                p.monthZhi +
                p.dayZhi;

            const total = base + p.hourZhi;

            const upper = guaRemainder(base);
            const lower = guaRemainder(total);

            /* 余0保留为0，表示没有动爻 */
            const moving = total % 6;

            currentNote =
                "起卦方式：终身卦\n" +
                "出生时间：" + formatDateTime(birth) + "\n" +
                "出生干支：" + pillarSummary(p) + "\n" +
                "基础数：" +
                p.yearGan + "＋" +
                p.yearZhi + "＋" +
                p.monthZhi + "＋" +
                p.dayZhi + "＝" + base + "\n" +
                "总数：" + base + "＋" + p.hourZhi +
                "＝" + total + "\n" +
                resultSummary(upper, lower, moving);

            generate(
                makeYao(upper, lower, moving),
                birth,
                currentNote,
                p
            );
        });
    });

    /* =========================
       年命卦
    ========================= */

$("modeYearSubmit").addEventListener("click", function () {
    run(function () {
        const date = readDate("datetime", "起卦时间");

        // 起卦时间仍使用完整的年月日时。
        const p = getPillars(date, true);

        // 年命只读取年份。
        const birthYear = getBirthYearInfo();

        const currentTotal =
            p.yearGan +
            p.yearZhi +
            p.monthZhi +
            p.dayZhi +
            p.hourZhi;

        const combinedTotal =
            currentTotal + birthYear.gan + birthYear.zhi;

        // 上下卦：余0作2。
        const upper = guaRemainder(currentTotal);
        const lower = guaRemainder(combinedTotal);

        // 动爻只用起卦总数，不加年命；余0则无动爻。
        const moving = currentTotal % 6;

        currentNote =
            "起卦方式：年命卦\n" +
            "年命归属年份：" + birthYear.year + "\n" +
            "年命干支：" + birthYear.gz + "\n" +
            "年命序数：干" + birthYear.gan +
            "、支" + birthYear.zhi + "\n" +
            "起卦干支：" + pillarSummary(p) + "\n" +
            "起卦总数：" +
            p.yearGan + "＋" +
            p.yearZhi + "＋" +
            p.monthZhi + "＋" +
            p.dayZhi + "＋" +
            p.hourZhi + "＝" + currentTotal + "\n" +
            "下卦总数：" +
            currentTotal + "＋" +
            birthYear.gan + "＋" +
            birthYear.zhi + "＝" + combinedTotal + "\n" +
            "动爻取数：" + currentTotal + "\n" +
            resultSummary(upper, lower, moving);

        generate(
            makeYao(upper, lower, moving),
            date,
            currentNote,
            p
        );
    });
});

    /* =========================
       时间起卦：保留上一版规则
    ========================= */

    $("modeTimeSubmit").addEventListener("click", function () {
        run(function () {
            const date = readDate("datetime", "起卦时间");
            const lunar = getLunar(date);

            const yearBranch = lunar.getYearInGanZhi().slice(-1);
            const yearNumber = serial(zhi, yearBranch, "农历年支");
            const monthNumber = Math.abs(lunar.getMonth());
            const dayNumber = lunar.getDay();
            const hourNumber =
                Math.floor((date.getHours() + 1) / 2) % 12 + 1;

            if (!Number.isInteger(monthNumber) ||
                monthNumber < 1 || monthNumber > 12 ||
                !Number.isInteger(dayNumber) ||
                dayNumber < 1 || dayNumber > 30) {
                throw new Error("农历月日读取失败，请检查 lunar.js。");
            }

            const base = yearNumber + monthNumber + dayNumber;
            const total = base + hourNumber;

            const upper = base % 8 || 8;
            const lower = total % 8 || 8;
            const moving = total % 6 || 6;

            currentNote =
                "起卦方式：时间起卦（农历年月日时取数）\n" +
                "年数：" + yearNumber +
                "；月数：" + monthNumber +
                "；日数：" + dayNumber +
                "；时数：" + hourNumber + "\n" +
                resultSummary(upper, lower, moving);

            generate(
                makeYao(upper, lower, moving),
                date,
                currentNote,
                null
            );
        });
    });

    /* =========================
       返回首页
    ========================= */

window.backHome = function () {
        $("resultCard").classList.add("hidden");
        $("headerCard").classList.remove("hidden");
        menu.classList.remove("hidden");

        // 返回刚才使用的起卦方式。
        // 尚无起卦方式记录时，才默认打开自选排盘。
        openMode(activeMode || "manual");

        // 保留已输入的时间、数字、出生资料和六爻选项。
        window.scrollTo({ top: 0, behavior: "smooth" });
    };

/*
     * 默认打开自选排盘。
     * 六爻输入框仍由原 window.onload 创建。
     */
    openMode("manual");
})();
</script>

<script>
(function () {
    "use strict";

    function moveQuestionToResult() {
        if (document.getElementById("resultQuestionEditor")) {
            return;
        }

        const inputCard = document.getElementById("inputCard");
        const resultCard = document.getElementById("resultCard");

        if (!inputCard || !resultCard) {
            console.warn("未找到设置区域或结果页，未移动所问事项。");
            return;
        }

        /*
         * 优先按原标签寻找输入框，
         * 再尝试常见的 question ID。
         */
        const oldLabel = Array.from(
            inputCard.querySelectorAll("label")
        ).find(label => /所问事项|占问事项/.test(label.textContent));

        let questionInput = null;

        if (oldLabel) {
            if (oldLabel.htmlFor) {
                questionInput = document.getElementById(
                    oldLabel.htmlFor
                );
            }

            if (!questionInput) {
                questionInput = oldLabel.querySelector(
                    "input, textarea"
                );
            }

            if (!questionInput && oldLabel.parentElement) {
                questionInput = oldLabel.parentElement.querySelector(
                    'textarea, input:not([type="datetime-local"]):not([type="button"]):not([type="submit"])'
                );
            }
        }

        if (!questionInput) {
            questionInput = inputCard.querySelector(
                "#question, #questionInput"
            );
        }

        if (
            !questionInput ||
            !questionInput.matches("input, textarea")
        ) {
            console.warn(
                "未找到所问事项输入框，请核对原输入框的 ID。"
            );
            return;
        }

        const oldParent = questionInput.parentElement;

        const editor = document.createElement("section");
        editor.id = "resultQuestionEditor";

        const newLabel = document.createElement("label");
        newLabel.textContent = "所问事项";

        if (!questionInput.id) {
            questionInput.id = "resultQuestionInput";
        }
        newLabel.htmlFor = questionInput.id;

        /*
         * 移动原输入框，保留原 ID、已有内容及事件。
         * 不影响原排盘函数对输入框的读取。
         */
questionInput.required = false;
        questionInput.removeAttribute("placeholder");

        editor.appendChild(newLabel);
        editor.appendChild(questionInput);

        // 放到结果页内容最下方。
        resultCard.appendChild(editor);

        // 删除设置页原来的标签。
        if (oldLabel) {
            oldLabel.remove();
        }

        // 如果原字段容器已空，则一并移除，避免留下空白。
        if (
            oldParent &&
            oldParent !== inputCard &&
            inputCard.contains(oldParent) &&
            oldParent.children.length === 0 &&
            oldParent.textContent.trim() === ""
        ) {
            oldParent.remove();
        }
    }

    if (document.readyState === "loading") {
        document.addEventListener(
            "DOMContentLoaded",
            moveQuestionToResult,
            { once: true }
        );
    } else {
        moveQuestionToResult();
    }
})();
</script>

<script>
(function () {
    "use strict";

    function initCompactHome() {
        const $ = id => document.getElementById(id);

        /*
         * 只替换说明文字。
         * 不改动输入框、按钮、计算方法。
         */
        function setRule(panelId, lines) {
            const panel = $(panelId);
            const rule = panel && panel.querySelector(".mode-rule");

            if (!rule) return;

            rule.replaceChildren();

            lines.forEach(text => {
                const line = document.createElement("div");
                line.textContent = text;
                rule.appendChild(line);
            });
        }

        setRule("modeNumberPanel", [
            "前两数为1～8，直取先天卦数作上下卦。",
            "第三数为1～6，直取动爻数。",
            "反之，则前两数÷8、取余作上下卦（余0作2）。第三数÷6取余作动爻。（余0无动爻）。"
        ]);

        setRule("modeYearPanel", [
            "起卦总数＝起卦年干＋年支＋月支＋日支＋时支。",
            "上卦：起卦总数÷8，余0作2。",
            "下卦：（起卦总数＋年命干＋年命支）÷8，余0作2。",
            "动爻：起卦总数÷6，余0无动爻。",
            "天干：甲1至癸10；地支：子1至亥12。"
        ]);

        setRule("modeLifePanel", [
            "基础数＝年干＋年支＋月支＋日支。",
            "上卦：基础数÷8，余0作2。",
            "总数＝基础数＋时支。",
            "下卦：总数÷8，余0作2。",
            "动爻：总数÷6，余0无动爻。"
        ]);

        setRule("modeTimePanel", [
            "年数＋月数＋日数，除以8取上卦。",
            "再加时数，除以8取下卦，除以6取动爻。",
            "余0时：上下卦取8，动爻取6。"
        ]);

        // 删除年命卦年份输入框下方的立春提示。
        const yearPanel = $("modeYearPanel");

        if (yearPanel) {
            yearPanel.querySelectorAll(".small-tip").forEach(tip => {
                if (/立春|仅输入年份/.test(tip.textContent)) {
                    tip.remove();
                }
            });
        }

        // 压缩起卦时间区域。
        const datetime = $("datetime");
        const nowButton = document.querySelector(
            "#modeSettings .mode-now-btn"
        );

        if (
            datetime &&
            nowButton &&
            datetime.parentElement === nowButton.parentElement &&
            datetime.parentElement.id !== "inputCard"
        ) {
            datetime.parentElement.classList.add(
                "compact-date-field"
            );
            nowButton.textContent = "现在";
            nowButton.setAttribute("aria-label", "使用当前时间");
        }

        /*
         * 手动六爻选择框可能由原 window.onload 创建，
         * 因此在初始化及页面加载后分别检查。
         */
        function compactManualFields() {
            const fields = Array.from(
                { length: 6 },
                (_, i) => $("manualYao" + i)
            );

            if (fields.some(field => !field)) return;

            const wrappers = fields.map(field => field.parentElement);
            const container = wrappers[0].parentElement;
            const manualCard = $("manualCard");

            if (
                !container ||
                !manualCard ||
                !manualCard.contains(container) ||
                new Set(wrappers).size !== 6 ||
                !wrappers.every(item => item.parentElement === container) ||
                container.children.length !== 6
            ) {
                return;
            }

            container.classList.add("compact-manual-grid");
        }

        compactManualFields();

        if (document.readyState !== "complete") {
            window.addEventListener(
                "load",
                compactManualFields,
                { once: true }
            );
        }

        // 只在首页启用紧凑布局，结果页恢复原样。
        const resultCard = $("resultCard");

        function syncPageLayout() {
            const isHome = !resultCard ||
                resultCard.classList.contains("hidden") ||
                resultCard.hidden ||
                getComputedStyle(resultCard).display === "none";

            document.body.classList.toggle("compact-home", isHome);
        }

        syncPageLayout();

        if (resultCard) {
            new MutationObserver(syncPageLayout).observe(resultCard, {
                attributes: true,
                attributeFilter: ["class", "style", "hidden"]
            });
        }

        // 补充移动端 viewport，但不禁用缩放。
        if (!document.querySelector('meta[name="viewport"]')) {
            const meta = document.createElement("meta");
            meta.name = "viewport";
            meta.content = "width=device-width, initial-scale=1";
            document.head.appendChild(meta);
        }
    }

    if (document.readyState === "loading") {
        document.addEventListener(
            "DOMContentLoaded",
            initCompactHome,
            { once: true }
        );
    } else {
        initCompactHome();
    }
})();
</script>
